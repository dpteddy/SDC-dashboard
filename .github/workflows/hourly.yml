name: Run hourly script

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install -r tools/scrape_weather_reqs.txt

      - name: Run web scraper
        run: python tools/scrape_weather.py

      - name: Commit and push new weather data
        run:
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather_data.csv
          git commit -m "Update weather data" || echo "No changes to commit"
          git push
